[project]
name = "smartime"
version = "0.8.0a2"
description = "順打輸入法 Shunda IME：免切換中英混打的注音輸入法（Windows / PIME backend）"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
# The runtime engine is deliberately stdlib-only so it can run on the
# portable embeddable Python that ships inside the PIME backend folder.
dependencies = []
# Development packages (tests, icons, lexicon build, voice input) are pinned
# in requirements.txt and requirements-voice.txt for a plain `python -m venv .venv`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
