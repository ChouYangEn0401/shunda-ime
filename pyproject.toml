[project]
name = "smartime"
version = "0.1.0"
description = "智慧輸入法：免切換中英混打的注音輸入法（Windows / PIME backend）"
readme = "README.md"
requires-python = ">=3.13"
# The runtime engine is deliberately stdlib-only so it can run on the
# portable embeddable Python that ships inside the PIME backend folder.
dependencies = []

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
]
# Only needed by tools/build_data.py to export the English word list.
build-data = ["wordfreq>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
